# One-off: sample the candidate 千字图 / 万字图 sites so the library scraper can
# be written against their real structure. Output goes to the job log only;
# nothing is committed. Runs on manual dispatch, or when this file or the probe
# script changes on a claude/* branch.

name: Probe library sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated URLs to probe (optional; defaults to the built-in list)'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths:
      - .github/workflows/probe-library.yml
      - tools/probe_library_sources.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe (manual URLs)
        if: ${{ inputs.urls != '' && inputs.urls != null }}
        env:
          URLS: ${{ inputs.urls }}
        run: python3 tools/probe_library_sources.py $URLS

      # Round 3: confirm chart ids, paging end, number search, 4dnum endpoints.
      - name: 4dluckybook — chart names and paging
        if: ${{ !inputs.urls }}
        run: |
          python3 tools/probe_library_sources.py --around 'id="bookname"' \
            "https://4dluckybook.com/home/bookitemlist?id=1" \
            "https://4dluckybook.com/home/bookitemlist?id=2" \
            "https://4dluckybook.com/home/bookitemlist?id=4"
          python3 tools/probe_library_sources.py --around 'bookitemitemname' \
            "https://4dluckybook.com/home/bookitemlist?id=1&offset=980" \
            "https://4dluckybook.com/home/bookitemlist?id=3&offset=9980" \
            "https://4dluckybook.com/home/bookitemlist?id=3&offset=10000"
      - name: tickalook — number search
        if: ${{ !inputs.urls }}
        run: |
          python3 tools/probe_library_sources.py --raw \
            "https://4d.tickalook.io/search?q=001" "https://4d.tickalook.io/search?q=0001" \
            "https://4d.tickalook.io/search?q=a"
      - name: 4dnum — axios GET calls
        if: ${{ !inputs.urls }}
        run: |
          python3 tools/probe_library_sources.py --around 'he\.get\(' \
            https://dream.4dnum.com/assets/index-99bc2759.js
