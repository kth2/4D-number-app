# One-off: sample the candidate 千字图 / 万字图 sites so the library scraper can
# be written against their real structure. Output goes to the job log only;
# nothing is committed. Runs on manual dispatch, or when this file or the probe
# script changes on a claude/* branch.

name: Probe library sources

on:
  workflow_dispatch:
    inputs:
      urls:
        description: 'Space-separated URLs to probe (optional; defaults to the built-in list)'
        required: false
        default: ''
  push:
    branches: ['claude/**']
    paths:
      - .github/workflows/probe-library.yml
      - tools/probe_library_sources.py

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Probe (manual URLs)
        if: ${{ inputs.urls != '' && inputs.urls != null }}
        env:
          URLS: ${{ inputs.urls }}
        run: python3 tools/probe_library_sources.py $URLS

      # Round 2: drill into the structures found by the first overview run.
      - name: 4dnum — API calls in the JS bundle
        if: ${{ !inputs.urls }}
        run: |
          python3 tools/probe_library_sources.py --around 'backend\.4dnum|api/v1|dictionary[123]|fetch\(|\.get\(`' \
            https://dream.4dnum.com/assets/index-99bc2759.js
      - name: 4dnum — API guesses
        if: ${{ !inputs.urls }}
        run: |
          python3 tools/probe_library_sources.py --raw \
            https://backend.4dnum.com/api/v1 \
            https://backend.4dnum.com/api/v1/dictionary1 \
            "https://backend.4dnum.com/api/v1/search/cn?query=%E8%9B%87" || true
      - name: 4dluckybook — list loader and chart pages
        if: ${{ !inputs.urls }}
        run: |
          python3 tools/probe_library_sources.py --raw \
            https://4dluckybook.com/scripts/home/bookitemlist.js \
            "https://4dluckybook.com/home/bookitemlist?id=3" \
            "https://4dluckybook.com/home/?menu=bookitem&id=1" \
            "https://4dluckybook.com/home/?menu=bookitem&id=2"
      - name: tickalook — inline search script
        if: ${{ !inputs.urls }}
        run: |
          python3 tools/probe_library_sources.py --around 'fetch|/search|const [A-Z]\b' https://4d.tickalook.io/
          python3 tools/probe_library_sources.py --raw "https://4d.tickalook.io/search?q=%E8%9B%87"
